name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── Job 1: Native tests ──────────────────────────
  test:
    name: Native Build & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y build-essential zlib1g-dev

      - name: Build test_engine
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Isrc/ \
            src/core/engine.cpp \
            src/core/play_stop.cpp \
            src/core/memfs.cpp \
            src/avm/avm2.cpp \
            src/avm/movie_clip.cpp \
            src/swf/swf_loader.cpp \
            src/render/webgl_renderer.cpp \
            src/render/canvas_renderer.cpp \
            src/audio/audio.cpp \
            src/bridge/external_interface.cpp \
            src/memory/allocator.cpp \
            tests/test_engine.cpp \
            -o build/test_engine -lz

      - name: Run engine tests
        run: ./build/test_engine

      - name: Build test_hoshi
        run: |
          g++ -std=c++17 -Wall -Isrc/ \
            src/core/engine.cpp \
            src/core/play_stop.cpp \
            src/core/memfs.cpp \
            src/avm/avm2.cpp \
            src/avm/movie_clip.cpp \
            src/swf/swf_loader.cpp \
            src/render/webgl_renderer.cpp \
            src/render/canvas_renderer.cpp \
            src/audio/audio.cpp \
            src/bridge/external_interface.cpp \
            src/memory/allocator.cpp \
            tests/test_hoshi.cpp \
            -o build/test_hoshi -lz

      - name: Download test games if missing
        run: |
          if [ ! -f "games/hoshi1/main.swf" ]; then
            mkdir -p games/hoshi1
            cd games/hoshi1
            curl -sO https://clausvalcatd.github.io/wasm_flash/games/hoshi1/main.swf
            for i in $(seq 1 36); do
              curl -sO https://clausvalcatd.github.io/wasm_flash/games/hoshi1/stg_${i}.swf
            done
          fi

      - name: Run Hoshi Saga tests
        run: ./build/test_hoshi
        env:
          HOSHI_PATH: games/hoshi1/

  # ─── Job 2: Emscripten WASM build ─────────────────
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61
          actions-cache-folder: emsdk-cache

      - name: Build WASM
        run: make -f Makefile.emscripten

      - name: Verify WASM
        run: |
          ls -lh dist/
          python3 -c "
          d = open('dist/waflash-reflexed.wasm','rb').read(4)
          assert d == b'\x00asm', f'Bad magic: {d!r}'
          print('WASM OK:', d)
          "

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: dist/
          retention-days: 7

  # ─── Job 3: Deploy to GitHub Pages ────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-wasm
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download WASM build
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: dist/

      - name: Prepare Pages
        run: |
          mkdir -p pages/

          # Engine files
          cp dist/waflash-reflexed.wasm     pages/
          cp dist/waflash-reflexed.js       pages/
          cp dist/waflash-reflexed-loader.js pages/ 2>/dev/null || true

          # Web player → index.html
          cp index.html pages/index.html

          # Game files
          [ -d games ] && cp -r games/ pages/games/ || true

          # WAFlash original as fallback
          [ -f waflash.wasm ]           && cp waflash.wasm pages/
          [ -f waflash.min.js ]         && cp waflash.min.js pages/
          [ -f waflash-player.min.js ]  && cp waflash-player.min.js pages/

          echo "=== Pages contents ==="
          find pages/ -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
